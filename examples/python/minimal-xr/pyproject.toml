[project]
name = "minimal-xr"
version = "0.1.0"
description = "Minimal ovxr Python example: load a USD stage and run a VR or AR session"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    # Development version ranges from deps/ovxr_deps.yaml. Packaging stamps
    # the exact versions built together.
    "ovrtx==0.7.0.1794596436",
    "ovstage==0.4.0.1794520352",
    "ovxr==0.2.0.1794933073",
]

[tool.uv]
# Windows reports x86-64 as AMD64 in PEP 508 platform_machine markers.
# Wheel tags still use win_amd64; keep those concepts separate.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]


[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
ovrtx = { index = "nvidia" }
ovstage = { index = "nvidia" }
ovxr = { index = "nvidia" }
